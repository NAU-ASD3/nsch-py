# Pre-commit hooks run locally before each commit.
# Mirrors the lint + format + type-check jobs in CI so developers catch
# issues without a CI round-trip. Pytest is intentionally not included
# here (too slow for every commit); CI is the gate for tests.
#
# First-time setup:
#   uv run pre-commit install
#
# Run manually against all files (e.g. after pulling new hook versions):
#   uv run pre-commit run --all-files

repos:
  # --- Basic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]  # NSCH .dta files are large; force LFS or skip.
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]


  # --- Local hooks: ruff, ruff-format, mypy ------------------------------
  # All three run the project's own tools through uv, for two different
  # reasons documented in issue #53:
  #
  # Ruff: the ruff-pre-commit mirror pins its own binary independent of the
  # dev dependency, and nothing bumps that pin, risking version drift between
  # what CI and developers run and what the hook enforces.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # mypy: the mirrors-mypy hook built an isolated venv containing only
      # what was manually listed in additional_dependencies, so any import
      # not in that list silently resolved to Any and broke type aliases
      # built from it. Running the project's own mypy in the project venv
      # means the hook sees the same packages CI and the gate see. Scoped
      # to src/ in the entry; tests use looser typing per pyproject.toml.
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
