# Pre-commit hooks run locally before each commit.
# Mirrors the lint + format + type-check jobs in CI so developers catch
# issues without a CI round-trip. Pytest is intentionally not included
# here (too slow for every commit); CI is the gate for tests.
#
# First-time setup:
#   uv run pre-commit install
#
# Run manually against all files (e.g. after pulling new hook versions):
#   uv run pre-commit run --all-files

repos:
  # --- Basic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]  # NSCH .dta files are large; force LFS or skip.
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]


  # --- Ruff: lint + format ----------------------------------------------
  # Ruff previously came from ruff-pre-commit, which pins its own binary
  # independent of the dev dependency, risking version drift between what
  # CI/devs run and what the hook enforces.

  # --- mypy: strict type checking ---------------------------------------
  # Runs the project's own mypy through uv, in the project's own venv, so
  # pre-commit and CI see the same tool version and the same installed
  # packages (numpy, polars, pydantic, ...). The pre-commit-mirrors-mypy
  # hook used to run this previously buildt an isolated venv containing
  # only what was manuall listed in additional_dependencies, so any import not
  # in that list silently resolves to Any and breaks type aliases built from it.
  # mypy is currently scoped to src/ directly in entry; tests use looser typing
  # per pyproject.toml.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
